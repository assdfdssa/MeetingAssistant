[package]
name = "classcatch-generation-live"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
serde = { version="1", features=["derive"] }
serde_json = "1"
reqwest = { version="0.11", features=["json"] }
tokio = { version="1", features=["macros","rt-multi-thread"] }
keyring = { version="3", features=["windows-native"] }
